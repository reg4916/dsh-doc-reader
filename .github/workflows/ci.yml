name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Syntax check
        run: |
          node --check index.js
          for f in lib/*.js; do node --check "$f"; done

      # tesseract.js downloads ~4 MB per language on first use; keep it out of
      # every run so the OCR tests stay fast and offline-able after the first.
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/tesseract
          key: tesseract-rus-eng-v1

      - name: Tests
        env:
          DSH_DOC_READER_OCR_CACHE: ${{ runner.temp }}/tesseract
        run: npm test

      - name: Package contents
        run: npm pack --dry-run
